<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveKit Connection Test</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>

<body>
    <h1>LiveKit Connection Test</h1>
    <div id="status">Disconnected</div>
    <div id="logs"></div>
    <button onclick="connect()">Connect</button>

    <script>
        const room = new LiveKitClient.Room();
        const statusDiv = document.getElementById('status');
        const logsDiv = document.getElementById('logs');

        function log(msg) {
            logsDiv.innerHTML += `<div>${new Date().toLocaleTimeString()} - ${msg}</div>`;
            console.log(msg);
        }

        room.on(LiveKitClient.RoomEvent.Connected, () => {
            statusDiv.innerText = 'Connected';
            statusDiv.style.color = 'green';
            log('Connected to room');
        });

        room.on(LiveKitClient.RoomEvent.Disconnected, () => {
            statusDiv.innerText = 'Disconnected';
            statusDiv.style.color = 'red';
            log('Disconnected from room');
        });

        room.on(LiveKitClient.RoomEvent.ParticipantConnected, (participant) => {
            log(`Participant connected: ${participant.identity}`);
        });

        async function connect() {
            try {
                log('Fetching token...');
                const response = await fetch('http://localhost:8000/livekit/token');
                const data = await response.json();

                log(`Got token. Connecting to ${data.url}...`);
                await room.connect(data.url, data.token);
                log('Connection successful!');

                // Publish microphone
                log('Publishing microphone...');
                await room.localParticipant.setMicrophoneEnabled(true);
                log('Microphone published');

            } catch (error) {
                log(`Error: ${error.message}`);
                console.error(error);
            }
        }
    </script>
</body>

</html>
